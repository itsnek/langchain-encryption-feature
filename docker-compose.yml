services:
# -----------------------------------------------------
# 1. Base Service Configuration
# -----------------------------------------------------
  base_app:
    image: ai_prompting
    # Set build context/path and Dockerfile once
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # Mount the current directory to /src inside the container
      - ./:/src/
    extra_hosts:
      # For communicating with the host machine
      - "host.docker.internal:host-gateway"
    # The command/entrypoint will be overridden in the extended services.

# -----------------------------------------------------
# 2. Specific Service Configurations
# -----------------------------------------------------
  plain_mistral:
    extends:
      service: base_app
    container_name: plain_mistral
    command: ["libs/langchain/tests/unit_tests/examples/input_chain_example.py", "mistral"]
    profiles:
      - plain

  plain_llama3.2:
    extends:
      service: base_app
    container_name: plain_llama3.2
    command: ["libs/langchain/tests/unit_tests/examples/input_chain_example.py", "llama3.2"]
    profiles:
      - plain

  plain_gemma3:
    extends:
      service: base_app
    container_name: plain_gemma3
    command: ["libs/langchain/tests/unit_tests/examples/input_chain_example.py", "gemma3"]
    profiles:
      - plain

  plain_falcon3:
    extends:
      service: base_app
    container_name: plain_falcon3
    command: ["libs/langchain/tests/unit_tests/examples/input_chain_example.py", "falcon3"]
    profiles:
      - plain

  encrypted_mistral:
    extends:
      service: base_app
    container_name: encrypted_mistral
    command: ["libs/langchain/tests/unit_tests/examples/encrypted_input_chain_example.py", "mistral"]
    profiles:
      - encrypted

  encrypted_llama3.2:
    extends:
      service: base_app
    container_name: encrypted_llama3.2
    command: ["libs/langchain/tests/unit_tests/examples/encrypted_input_chain_example.py", "llama3.2"]
    profiles:
      - encrypted

  encrypted_gemma3:
    extends:
      service: base_app
    container_name: encrypted_gemma3
    command: ["libs/langchain/tests/unit_tests/examples/encrypted_input_chain_example.py", "gemma3"]
    profiles:
      - encrypted

  encrypted_falcon3:
    extends:
      service: base_app
    container_name: encrypted_falcon3
    command: ["libs/langchain/tests/unit_tests/examples/encrypted_input_chain_example.py", "falcon3"]
    profiles:
      - encrypted

  judge_mistral:
    extends:
      service: base_app
    container_name: judge_mistral
    command: ["libs/langchain/langchain/utils/evaluation_sklearn.py", "results/plain/mistral_plain.xlsx"]
    profiles:
      - judge

  judge_llama3.2:
    extends:
      service: base_app
    container_name: judge_llama3.2
    command: ["libs/langchain/langchain/utils/evaluation_sklearn.py", "results/plain/llama3.2_plain.xlsx"]
    profiles:
      - judge

  judge_gemma3:
    extends:
      service: base_app
    container_name: judge_gemma3
    command: ["libs/langchain/langchain/utils/evaluation_sklearn.py", "results/plain/gemma3_plain.xlsx"]
    profiles:
      - judge

  judge_falcon3:
    extends:
      service: base_app
    container_name: judge_falcon3
    command: ["libs/langchain/langchain/utils/evaluation_sklearn.py", "results/plain/falcon3_plain.xlsx"]
    profiles:
      - judge
